[project]
name = "lingo-cli"
version = "0.1.1"
description = "CLI tool for converting text to the NATO phonetic alphabet equivalent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.scripts]
lingo = "lingo:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lingo"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.31",
]

[project.urls]
Issues = "https://github.com/siddharth-shringarpure/lingo/issues"
Releases = "https://github.com/siddharth-shringarpure/lingo/releases"
Repository = "https://github.com/siddharth-shringarpure/lingo"