name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Detect whether to publish
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: >
          uv run --isolated --no-project --with packaging
          python .github/scripts/detect_release.py

  publish:
    name: Build And Publish
    runs-on: ubuntu-latest
    needs: detect-release
    if: needs.detect-release.outputs.should_publish == 'true'
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Build package
        run: uv build

      - name: Smoke test wheel
        run: >
          uv run --isolated --no-project
          --with dist/*.whl
          -- lingo "abc"

      - name: Smoke test source distribution
        run: >
          uv run --isolated --no-project
          --with dist/*.tar.gz
          -- lingo "abc"

      - name: Publish to PyPI
        run: uv publish

      - name: Create release tag
        env:
          TAG_NAME: v${{ needs.detect-release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-release.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
